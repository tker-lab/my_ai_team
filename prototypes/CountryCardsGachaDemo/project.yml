name: CountryCardsGachaDemo
options:
  bundleIdPrefix: com.countrycards.prototype
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGNING_ALLOWED: NO
targets:
  CountryCardsGachaDemo:
    type: application
    platform: iOS
    sources:
      - CountryCardsGachaDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.countrycards.prototype.gachademo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gacha Demo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
