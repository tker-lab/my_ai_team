  <h2>写真・動画が表示されない場合</h2>
  <ul><li>写真ライブラリへのアクセス許可を確認してください。</li><li>日時・種類・アルバムなどの条件を少し減らしてください。</li><li>iCloud上だけにある項目は、通信状況によって読み込みに時間がかかる場合があります。</li></ul>
