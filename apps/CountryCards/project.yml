name: CountryCards
options:
  bundleIdPrefix: com.aiteam
  deploymentTarget:
    iOS: "17.0"
# 広告SDK(Google Mobile Ads SDK、通称AdMob SDK)をSwift Package Manager(SPM。
# Xcode/Appleが標準で用意している「外部ライブラリを取り込む仕組み」)で導入する。
# CocoaPods(別の取り込み方式)は使わず、xcodegenの中でSPMだけで統一する。
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.9.0
targets:
  CountryCards:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CountryCards
    entitlements:
      path: CountryCards/CountryCards.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: CountryCards/Info.plist
      properties:
        CFBundleDisplayName: 国カードバトル
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # 【広告SDK(2026-09-15追加)】AdMob(Googleの広告配信サービス)の「アプリID」。
        # SDKがどのAdMobアプリの広告を配信するかを識別するための固定値で、広告の
        # ユニット(バナー・リワード)ごとのIDとは別物。テスト/本番で共通の値を使う。
        GADApplicationIdentifier: ca-app-pub-9196912743325616~4281467223
        # SKAdNetworkItems:iOSの広告計測の仕組み(SKAdNetwork)向けに、広告配信元
        # (Google本体+提携先)を許可リストとしてOSへ事前登録するもの。Appleの
        # プライバシー保護の一環で、これが無いと一部の広告network経由の配信・
        # 収益計測が正しく機能しない。値はGoogle公式ドキュメントに掲載の一覧をそのまま使用
        # (https://developers.google.com/admob/ios/quick-start 2026-09-15時点)。
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        # 【ATT(App Tracking Transparency)について・2026-09-15判断】
        # NSUserTrackingUsageDescription(「追跡の許可を求める」ダイアログの説明文)は
        # 追加しない。ATTTrackingManager.requestTrackingAuthorization()を呼ばない限り
        # Appleはこのキーを必須にしないため、記載しなくてもApp Store審査には抵触しない。
        # このアプリはIDFA(端末ごとの広告識別子。他アプリと結びつけた広告追跡に使われる)
        # を取得・利用せず、広告は「パーソナライズなし(非パーソナライズ)」運用とする。
        # 理由:①個人開発の初版でATT許諾率の最適化まで手を出す優先度が低い
        # ②IDFAを使わなければAppleの「トラッキング」の定義に当たらずATTは不要になる
        # ③CEOへの説明・運用コストを増やさずに済む。将来、広告収益を本格的に伸ばしたい
        # 場合はATT許諾フローの追加を再検討する(詳細はapp_team_country_cards.md参照)。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiteam.CountryCards
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development"
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        # PhotoTimerと同じ無料Apple ID(Personal Team)のTeam IDを使い回す。
        # (詳細: .claude/agent-memory/app-team/free-apple-id-device-signing.md)
        DEVELOPMENT_TEAM: ZW257YHSQM
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      # 全国ランキング(所持枚数・対戦勝利数・ガチャ回数)をGame Centerで
      # 実現するために必要なフレームワーク。
      - sdk: GameKit.framework
      # ¥100の10連ガチャ(App内課金)に必要なフレームワーク。
      - sdk: StoreKit.framework
      # バナー広告(画面下部常時表示)・リワード広告(ガチャ追加用)を配信するための
      # Google Mobile Ads SDK本体。
      - package: GoogleMobileAds
        product: GoogleMobileAds
  # 「タップして開封→カードが順にめくれる」という操作フローが実際に動くかを
  # 人手のタップなしで自動確認するためのUIテスト。アプリ本体は一切変更しない。
  CountryCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CountryCardsUITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.aiteam.CountryCardsUITests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CountryCards
schemes:
  CountryCards:
    build:
      targets:
        CountryCards: all
        CountryCardsUITests: [test]
    test:
      targets:
        - CountryCardsUITests
    run:
      config: Debug
      # ¥100の10連ガチャをApp Store Connectの本物の課金無しで試せるようにする設定。
      # 【既知の制約】xcodegenの制約で test: 配下には反映されないことがあるため、
      # UIテスト実行では本物のApp Store側に問い合わせに行こうとする。
      # 通常の実行(Xcodeからの Run、CEOが試す時)ではこの設定が使われる。
      # 詳細: .claude/agent-memory/app-team/xcodegen-storekit-configuration-scheme-placement.md
      storeKitConfiguration: CountryCards/Configuration.storekit
